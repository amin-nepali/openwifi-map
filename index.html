<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Wi-Fi Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
            display: flex; 
            height: 100vh; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            overflow: hidden; 
        }

        #sidebar {
            width: 380px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .header { 
            padding: 20px; 
            border-bottom: 1px solid var(--border); 
            background: rgba(15, 23, 42, 0.6); 
        }

        .header h1 { 
            font-size: 1.25rem; 
            color: #38bdf8; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .content { 
            padding: 20px; 
            overflow-y: auto; 
            flex: 1; 
        }

        .card { 
            background: rgba(15, 23, 42, 0.4); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 20px; 
        }

        .form-group { 
            margin-bottom: 14px; 
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 6px; 
            font-weight: 500; 
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus { 
            border-color: var(--primary); 
        }

        .btn-group { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 12px; 
        }

        .consent-box {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 6px;
            padding: 12px;
            margin: 15px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .consent-box input[type="checkbox"] { 
            margin-top: 3px; 
            width: 16px; 
            height: 16px; 
            accent-color: var(--primary); 
            cursor: pointer; 
        }

        .consent-box label { 
            font-size: 0.8rem; 
            color: #cbd5e1; 
            line-height: 1.4; 
            margin: 0; 
            cursor: pointer; 
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }
        .btn:disabled { background: var(--border); cursor: not-allowed; opacity: 0.6; }

        #reader { 
            width: 100%; 
            margin-bottom: 12px; 
            border-radius: 6px; 
            overflow: hidden; 
            display: none; 
            background: #000; 
        }

        #map { 
            flex: 1; 
            height: 100%; 
            background: #e5e3df; 
        }

        /* Leaflet Popup Styling */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { 
            background: var(--panel-bg); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
        }
        .leaflet-popup-content h3 { color: #38bdf8; margin-bottom: 6px; font-size: 1.1rem; }
        .leaflet-popup-content p { margin: 4px 0; font-size: 0.85rem; color: var(--text-muted); }
        .wifi-key { 
            background: #0f172a; 
            padding: 6px 10px; 
            border-radius: 4px; 
            font-family: monospace; 
            color: var(--success); 
            margin-top: 8px; 
        }

        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 50vh; }
            #map { height: 50vh; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Controls -->
    <div id="sidebar">
        <div class="header">
            <h1><i class="fa-solid fa-wifi"></i> Community Access Map</h1>
        </div>

        <div class="content">
            <div class="card">
                <h2 style="font-size: 1rem; margin-bottom: 12px;">
                    <i class="fa-solid fa-house-signal"></i> Share Wi-Fi Hotspot
                </h2>

                <!-- QR Scanner Actions -->
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" id="btnCameraQR">
                        <i class="fa-solid fa-camera"></i> Camera QR
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnGalleryQR">
                        <i class="fa-solid fa-image"></i> Gallery QR
                    </button>
                </div>

                <!-- Live Camera Feed Container -->
                <div id="reader"></div>
                <input type="file" id="qrFileInput" accept="image/*" style="display: none;">

                <form id="wifiForm">
                    <div class="form-group">
                        <label>Venue / Location Name</label>
                        <input type="text" id="venueName" placeholder="e.g. Central Perk Cafe" required>
                    </div>

                    <div class="form-group">
                        <label>Wi-Fi Network Name (SSID)</label>
                        <input type="text" id="ssid" placeholder="Auto-filled via QR or type SSID" required>
                    </div>

                    <div class="form-group">
                        <label>Network Password</label>
                        <input type="text" id="password" placeholder="Auto-filled via QR or type key">
                    </div>

                    <div class="form-group">
                        <label>Usage Note / Courtesy Rules</label>
                        <textarea id="notes" rows="2" placeholder="e.g. Free with purchase"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Current Pin Location</label>
                        <input type="text" id="locationStatus" value="Click 'Get Location' below" readonly style="color: var(--text-muted);">
                    </div>

                    <button type="button" class="btn btn-secondary" id="btnLocate" style="margin-bottom: 12px;">
                        <i class="fa-solid fa-location-crosshairs"></i> Get GPS Location
                    </button>

                    <div class="consent-box">
                        <input type="checkbox" id="ownerConsent" required>
                        <label for="ownerConsent">
                            <strong>I am the Network Owner / Representative.</strong> I explicitly consent to sharing this network with the public.
                        </label>
                    </div>

                    <button type="submit" class="btn" id="btnSubmit" disabled>
                        <i class="fa-solid fa-share-nodes"></i> Publish Network Spot
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Map Area -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Endpoint for local Node.js server
        const API_URL = "https://openwifi-map.onrender.com/api/hotspots";

        let map, userMarker;
        let selectedCoords = null;
        let html5QrCode = null;

        function initMap() {
            // Center map initially
            map = L.map('map').setView([27.7172, 85.3240], 13);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(map);

            // Handle manual pin selection on click
            map.on('click', (e) => {
                setFormLocation(e.latlng.lat, e.latlng.lng, "Selected pin on map");
            });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    map.setView([pos.coords.latitude, pos.coords.longitude], 16);
                });
            }

            // Fetch stored hotspots from MySQL DB via server.js
            fetchHotspotsFromDatabase();
        }

        // Fetch hotspots from Node.js backend
        async function fetchHotspotsFromDatabase() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const hotspots = await response.json();
                    hotspots.forEach(spot => renderHotspotOnMap(spot));
                }
            } catch (err) {
                console.warn("Could not connect to backend server. Make sure 'node server.js' is running.", err);
            }
        }

        // Submit new hotspot to Node.js backend
        async function saveHotspotToDatabase(newSpot) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newSpot)
                });

                if (response.ok) {
                    alert("Wi-Fi spot successfully published to MySQL database!");
                    renderHotspotOnMap(newSpot);
                } else {
                    const errData = await response.json();
                    alert("Database Save Failed: " + errData.error);
                }
            } catch (err) {
                alert("Server Error: Unable to reach http://localhost:3000. Is server.js running?");
            }
        }

        // ------------------------------------------
        // QR Code Reader Handlers (Camera & Gallery)
        // ------------------------------------------
        
        // Live Camera Scan
        document.getElementById('btnCameraQR').addEventListener('click', () => {
            const readerDiv = document.getElementById('reader');
            readerDiv.style.display = 'block';

            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    parseWifiString(decodedText);
                    html5QrCode.stop();
                    readerDiv.style.display = 'none';
                },
                () => {}
            ).catch(() => {
                alert("Camera unavailable or permission denied.");
                readerDiv.style.display = 'none';
            });
        });

        // Gallery File Upload Scan
        document.getElementById('btnGalleryQR').addEventListener('click', () => {
            document.getElementById('qrFileInput').click();
        });

        document.getElementById('qrFileInput').addEventListener('change', e => {
            if (e.target.files.length === 0) return;
            const imageFile = e.target.files[0];
            const qrScanner = new Html5Qrcode("reader");

            qrScanner.scanFile(imageFile, true)
                .then(decodedText => parseWifiString(decodedText))
                .catch(() => alert("No valid Wi-Fi QR code found in the selected image."));
        });

        // Convert standard Wi-Fi QR format (WIFI:S:MySSID;P:MyPassword;;) to inputs
        function parseWifiString(wifiStr) {
            const ssidMatch = wifiStr.match(/S:([^;]+)/);
            const passMatch = wifiStr.match(/P:([^;]+)/);

            if (ssidMatch && ssidMatch[1]) document.getElementById('ssid').value = ssidMatch[1];
            if (passMatch && passMatch[1]) {
                document.getElementById('password').value = passMatch[1];
            } else {
                document.getElementById('password').value = "None (Open Network)";
            }

            alert("Wi-Fi credentials parsed and filled successfully!");
        }

        // ------------------------------------------
        // Map Location & Form Handlers
        // ------------------------------------------
        document.getElementById('btnLocate').addEventListener('click', () => {
            if (!navigator.geolocation) return alert("Geolocation not supported");

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    map.setView([latitude, longitude], 16);
                    setFormLocation(latitude, longitude, "GPS Location Acquired");
                },
                (err) => alert("Unable to get location: " + err.message),
                { enableHighAccuracy: true }
            );
        });

        function setFormLocation(lat, lng, labelText) {
            selectedCoords = { lat, lng };
            document.getElementById('locationStatus').value = `${labelText} (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.marker([lat, lng], { draggable: true }).addTo(map);
                userMarker.on('dragend', (e) => {
                    const pos = e.target.getLatLng();
                    selectedCoords = { lat: pos.lat, lng: pos.lng };
                    document.getElementById('locationStatus').value = `Custom Marker (${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)})`;
                });
            }
        }

        const consentCheckbox = document.getElementById('ownerConsent');
        const submitBtn = document.getElementById('btnSubmit');

        consentCheckbox.addEventListener('change', (e) => {
            submitBtn.disabled = !e.target.checked;
        });

        document.getElementById('wifiForm').addEventListener('submit', (e) => {
            e.preventDefault();

            if (!selectedCoords) return alert("Please select a location on the map.");

            const payload = {
                venueName: document.getElementById('venueName').value,
                ssid: document.getElementById('ssid').value,
                password: document.getElementById('password').value || "None (Open)",
                notes: document.getElementById('notes').value || "No special instructions",
                lat: selectedCoords.lat,
                lng: selectedCoords.lng
            };

            saveHotspotToDatabase(payload);

            document.getElementById('wifiForm').reset();
            submitBtn.disabled = true;
            selectedCoords = null;
            if (userMarker) map.removeLayer(userMarker);
        });

        function renderHotspotOnMap(spot) {
            const wifiIcon = L.divIcon({
                html: `<div style="background:#10b981; color:white; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 0 10px rgba(0,0,0,0.3);">
                        <i class="fa-solid fa-wifi"></i>
                       </div>`,
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            const popupContent = `
                <div>
                    <h3>${escapeHtml(spot.venue_name || spot.venueName)}</h3>
                    <p style="color:#10b981; font-weight:bold;"><i class="fa-solid fa-circle-check"></i> Owner Consented</p>
                    <p style="margin-top:8px;"><strong>SSID:</strong> ${escapeHtml(spot.ssid)}</p>
                    <div class="wifi-key">Key: ${escapeHtml(spot.password)}</div>
                    <p style="margin-top:8px; font-style:italic;">"${escapeHtml(spot.notes)}"</p>
                </div>
            `;

            L.marker([parseFloat(spot.lat), parseFloat(spot.lng)], { icon: wifiIcon })
                .addTo(map)
                .bindPopup(popupContent);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = initMap;
    </script>
</body>
</html>
