<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenWifi Map | Find Community-Shared Wi-Fi</title>
    <meta name="description" content="Discover community-shared public Wi-Fi hotspots on an interactive map, or share a network you own with your community.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://openwifi-map.onrender.com/">
    <meta property="og:type" content="website">
    <meta property="og:title" content="OpenWifi Map | Find Community-Shared Wi-Fi">
    <meta property="og:description" content="Discover community-shared public Wi-Fi hotspots on an interactive map, or share a network you own with your community.">
    <meta property="og:url" content="https://openwifi-map.onrender.com/">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="OpenWifi Map | Find Community-Shared Wi-Fi">
    <meta name="twitter:description" content="Discover community-shared public Wi-Fi hotspots on an interactive map, or share a network you own with your community.">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebApplication",
            "name": "OpenWifi Map",
            "url": "https://openwifi-map.onrender.com/",
            "description": "Discover community-shared public Wi-Fi hotspots on an interactive map, or share a network you own with your community.",
            "applicationCategory": "TravelApplication",
            "operatingSystem": "Any"
        }
    </script>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #10b981;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
            display: flex; 
            height: 100vh; 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            overflow: hidden; 
        }

        #sidebar {
            width: 380px;
            background: var(--panel-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 15px rgba(0,0,0,0.3);
        }

        .header { 
            padding: 20px; 
            border-bottom: 1px solid var(--border); 
            background: rgba(15, 23, 42, 0.6); 
        }

        .header h1 { 
            font-size: 1.25rem; 
            color: #38bdf8; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }

        .content { 
            padding: 20px; 
            overflow-y: auto; 
            flex: 1; 
        }

        .card { 
            background: rgba(15, 23, 42, 0.4); 
            border: 1px solid var(--border); 
            border-radius: 8px; 
            padding: 16px; 
            margin-bottom: 20px; 
        }

        .form-group { 
            margin-bottom: 14px; 
        }

        .field-label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .location-status {
            color: var(--text-muted);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            margin-bottom: 6px; 
            font-weight: 500; 
        }

        input[type="text"], input[type="password"], textarea {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus { 
            border-color: var(--primary); 
        }

        .btn-group { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 12px; 
        }

        .consent-box {
            background: rgba(37, 99, 235, 0.1);
            border: 1px solid rgba(37, 99, 235, 0.3);
            border-radius: 6px;
            padding: 12px;
            margin: 15px 0;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .consent-box input[type="checkbox"] { 
            margin-top: 3px; 
            width: 16px; 
            height: 16px; 
            accent-color: var(--primary); 
            cursor: pointer; 
        }

        .consent-box label { 
            font-size: 0.8rem; 
            color: #cbd5e1; 
            line-height: 1.4; 
            margin: 0; 
            cursor: pointer; 
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
        }

        .btn:hover { background: var(--primary-hover); }
        .btn-secondary { background: #334155; }
        .btn-secondary:hover { background: #475569; }
        .btn:disabled { background: var(--border); cursor: not-allowed; opacity: 0.6; }

        #reader { 
            width: 100%; 
            margin-bottom: 12px; 
            border-radius: 6px; 
            overflow: hidden; 
            display: none; 
            background: #000; 
        }

        #map { 
            flex: 1; 
            height: 100%; 
            background: #e5e3df; 
        }

        /* Leaflet Popup Styling */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip { 
            background: var(--panel-bg); 
            color: var(--text-main); 
            border: 1px solid var(--border); 
        }
        .leaflet-popup-content h3 { color: #38bdf8; margin-bottom: 6px; font-size: 1.1rem; }
        .leaflet-popup-content p { margin: 4px 0; font-size: 0.85rem; color: var(--text-muted); }
        .wifi-key { 
            background: #0f172a; 
            padding: 6px 10px; 
            border-radius: 4px; 
            font-family: monospace; 
            color: var(--success); 
            margin-top: 8px; 
        }

        .popup-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .popup-action {
            flex: 1;
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 4px;
            background: var(--primary);
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .popup-action-secondary { background: #334155; }

        .wifi-dialog {
            width: min(92vw, 380px);
            max-height: 90vh;
            margin: auto;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel-bg);
            color: var(--text-main);
        }

        .wifi-dialog::backdrop { background: rgba(0, 0, 0, 0.65); }

        .dialog-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .dialog-header h2 { font-size: 1.1rem; }

        .dialog-close {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 4px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
        }

        #wifiQrCode {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 256px;
            height: 256px;
            max-width: 100%;
            margin: 16px auto;
            padding: 8px;
            background: white;
        }

        .wifi-dialog .btn-group { margin-top: 18px; }

        @media (max-width: 768px) {
            body { flex-direction: column-reverse; }
            #sidebar { width: 100%; height: 50vh; }
            #map { height: 50vh; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Controls -->
    <div id="sidebar">
        <div class="header">
            <h1><i class="fa-solid fa-wifi"></i> Community Access Map</h1>
        </div>

        <div class="content">
            <div class="card">
                <h2 style="font-size: 1rem; margin-bottom: 12px;">
                    <i class="fa-solid fa-house-signal"></i> Share Wi-Fi Hotspot
                </h2>

                <!-- QR Scanner Actions -->
                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" id="btnCameraQR">
                        <i class="fa-solid fa-camera"></i> Camera QR
                    </button>
                    <button type="button" class="btn btn-secondary" id="btnGalleryQR">
                        <i class="fa-solid fa-image"></i> Gallery QR
                    </button>
                </div>

                <!-- Live Camera Feed Container -->
                <div id="reader"></div>
                <input type="file" id="qrFileInput" accept="image/*" style="display: none;">

                <form id="wifiForm">
                    <div class="form-group">
                        <label>Wi-Fi Network Name (SSID)</label>
                        <input type="text" id="ssid" placeholder="Auto-filled via QR or type SSID" maxlength="32" required>
                    </div>

                    <div class="form-group">
                        <label>Network Password</label>
                        <input type="password" id="password" placeholder="Auto-filled via QR or type key" autocomplete="new-password">
                    </div>

                    <div class="form-group">
                        <span class="field-label">Location</span>
                        <p id="locationStatus" class="location-status" role="status" aria-live="polite">Getting your current location...</p>
                    </div>

                    <button type="button" class="btn btn-secondary" id="btnLocate" style="margin-bottom: 12px;">
                        <i class="fa-solid fa-location-crosshairs"></i> Use Current Location
                    </button>

                    <div class="consent-box">
                        <input type="checkbox" id="ownerConsent" required>
                        <label for="ownerConsent">
                            <strong>I am the Network Owner / Representative.</strong> I explicitly consent to sharing this network with the public.
                        </label>
                    </div>

                    <button type="submit" class="btn" id="btnSubmit" disabled>
                        <i class="fa-solid fa-share-nodes"></i> Publish Network Spot
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Map Area -->
    <div id="map"></div>

    <dialog id="connectDialog" class="wifi-dialog" aria-labelledby="connectTitle">
        <div class="dialog-header">
            <h2 id="connectTitle">Connect to Wi-Fi</h2>
            <button type="button" class="dialog-close" id="closeConnectDialog" aria-label="Close" title="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <p id="connectSsid" class="location-status"></p>
        <div id="wifiQrCode" aria-hidden="true"></div>
        <p id="connectMessage" class="location-status" role="status" aria-live="polite">Scan with your phone camera to join.</p>
    </dialog>

    <dialog id="editDialog" class="wifi-dialog" aria-labelledby="editTitle">
        <div class="dialog-header">
            <h2 id="editTitle">Edit Wi-Fi details</h2>
            <button type="button" class="dialog-close" id="closeEditDialog" aria-label="Close" title="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="editForm">
            <div class="form-group">
                <label for="editSsid">Network name (SSID)</label>
                <input type="text" id="editSsid" maxlength="32" required>
            </div>
            <div class="form-group">
                <label for="editPassword">Network password</label>
                <input type="password" id="editPassword" autocomplete="new-password">
            </div>
            <div class="btn-group">
                <button type="button" class="btn btn-secondary" id="cancelEdit">Cancel</button>
                <button type="submit" class="btn" id="saveEdit">Save changes</button>
            </div>
        </form>
    </dialog>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Endpoint for local Node.js server
        const API_URL = "/api/hotspots";

        let map, userMarker;
        let selectedCoords = null;
        let html5QrCode = null;
        const hotspotMarkers = new Map();
        let editingHotspot = null;

        function initMap() {
            // Center map initially
            map = L.map('map').setView([27.7172, 85.3240], 13);

            const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            });
            const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
                attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
                maxZoom: 19
            });

            streetLayer.addTo(map);
            L.control.layers({ Street: streetLayer, Satellite: satelliteLayer }).addTo(map);

            // Handle manual pin selection on click
            map.on('click', (e) => {
                setFormLocation(e.latlng.lat, e.latlng.lng, "Selected pin on map");
            });

            locateUser();

            // Fetch stored hotspots from MySQL DB via server.js
            fetchHotspotsFromDatabase();
        }

        // Fetch hotspots from Node.js backend
        async function fetchHotspotsFromDatabase() {
            try {
                const response = await fetch(API_URL);
                if (response.ok) {
                    const hotspots = await response.json();
                    hotspots.forEach(spot => renderHotspotOnMap(spot));
                }
            } catch (err) {
                console.warn("Could not connect to backend server. Make sure 'node server.js' is running.", err);
            }
        }

        // Submit new hotspot to Node.js backend
        async function saveHotspotToDatabase(newSpot) {
            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newSpot)
                });

                if (response.ok) {
                    const result = await response.json();
                    alert("Wi-Fi spot successfully published to MySQL database!");
                    renderHotspotOnMap({ ...newSpot, id: result.id });
                } else {
                    const errData = await response.json();
                    alert("Database Save Failed: " + errData.error);
                }
            } catch (err) {
                alert("Server Error: Unable to reach http://localhost:3000. Is server.js running?");
            }
        }

        async function updateHotspotInDatabase(spot, ssid, password) {
            const saveButton = document.getElementById('saveEdit');
            saveButton.disabled = true;

            try {
                const response = await fetch(`${API_URL}/${encodeURIComponent(spot.id)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ssid, password: password || 'None (Open)' })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    alert("Update failed: " + errorData.error);
                    return;
                }

                const updatedSpot = { ...spot, ssid, password: password || 'None (Open)' };
                renderHotspotOnMap(updatedSpot);
                document.getElementById('editDialog').close();
                alert("Wi-Fi details updated.");
            } catch (err) {
                alert("Server Error: Unable to update this hotspot.");
            } finally {
                saveButton.disabled = false;
            }
        }

        // ------------------------------------------
        // QR Code Reader Handlers (Camera & Gallery)
        // ------------------------------------------
        
        // Live Camera Scan
        document.getElementById('btnCameraQR').addEventListener('click', () => {
            const readerDiv = document.getElementById('reader');
            readerDiv.style.display = 'block';

            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    parseWifiString(decodedText);
                    html5QrCode.stop();
                    readerDiv.style.display = 'none';
                },
                () => {}
            ).catch(() => {
                alert("Camera unavailable or permission denied.");
                readerDiv.style.display = 'none';
            });
        });

        // Gallery File Upload Scan
        document.getElementById('btnGalleryQR').addEventListener('click', () => {
            document.getElementById('qrFileInput').click();
        });

        document.getElementById('qrFileInput').addEventListener('change', e => {
            if (e.target.files.length === 0) return;
            const imageFile = e.target.files[0];
            const qrScanner = new Html5Qrcode("reader");

            qrScanner.scanFile(imageFile, true)
                .then(decodedText => parseWifiString(decodedText))
                .catch(() => alert("No valid Wi-Fi QR code found in the selected image."));
        });

        // Convert standard Wi-Fi QR format (WIFI:S:MySSID;P:MyPassword;;) to inputs
        function parseWifiString(wifiStr) {
            const ssidMatch = wifiStr.match(/S:([^;]+)/);
            const passMatch = wifiStr.match(/P:([^;]+)/);

            if (ssidMatch && ssidMatch[1]) document.getElementById('ssid').value = ssidMatch[1];
            if (passMatch && passMatch[1]) {
                document.getElementById('password').value = passMatch[1];
            } else {
                document.getElementById('password').value = "None (Open Network)";
            }

            alert("Wi-Fi credentials parsed and filled successfully!");
        }

        // ------------------------------------------
        // Map Location & Form Handlers
        // ------------------------------------------
        document.getElementById('btnLocate').addEventListener('click', locateUser);

        function locateUser() {
            const status = document.getElementById('locationStatus');
            if (!navigator.geolocation) {
                status.textContent = "Location is unavailable. Select a pin on the map.";
                return;
            }

            status.textContent = "Getting your current location...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    map.setView([latitude, longitude], 16);
                    setFormLocation(latitude, longitude, "Current location");
                },
                () => {
                    status.textContent = "Could not get your location. Select a pin on the map or try again.";
                },
                { enableHighAccuracy: true }
            );
        }

        function setFormLocation(lat, lng, labelText) {
            selectedCoords = { lat, lng };
            document.getElementById('locationStatus').textContent = `${labelText} (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

            if (userMarker) {
                userMarker.setLatLng([lat, lng]);
            } else {
                userMarker = L.marker([lat, lng], { draggable: true }).addTo(map);
                userMarker.on('dragend', (e) => {
                    const pos = e.target.getLatLng();
                    selectedCoords = { lat: pos.lat, lng: pos.lng };
                    document.getElementById('locationStatus').textContent = `Custom pin (${pos.lat.toFixed(4)}, ${pos.lng.toFixed(4)})`;
                });
            }
        }

        const editDialog = document.getElementById('editDialog');
        const editForm = document.getElementById('editForm');

        function openEditDialog(spot) {
            editingHotspot = spot;
            document.getElementById('editSsid').value = spot.ssid || '';
            document.getElementById('editPassword').value =
                spot.password === 'None (Open)' || spot.password === 'None (Open Network)' ? '' : (spot.password || '');
            editDialog.showModal();
        }

        editForm.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!editingHotspot) return;

            updateHotspotInDatabase(
                editingHotspot,
                document.getElementById('editSsid').value,
                document.getElementById('editPassword').value
            );
        });

        document.getElementById('closeEditDialog').addEventListener('click', () => editDialog.close());
        document.getElementById('cancelEdit').addEventListener('click', () => editDialog.close());
        editDialog.addEventListener('close', () => {
            editingHotspot = null;
            editForm.reset();
        });

        const connectDialog = document.getElementById('connectDialog');
        const wifiQrCode = document.getElementById('wifiQrCode');
        document.getElementById('closeConnectDialog').addEventListener('click', () => connectDialog.close());

        function escapeWifiQrValue(value) {
            return String(value).replace(/([\\;:,\"])/g, '\\$1');
        }

        function showWifiQr(spot) {
            const password = spot.password === 'None (Open)' || spot.password === 'None (Open Network)' ? '' : (spot.password || '');
            const qrText = password
                ? `WIFI:T:WPA;S:${escapeWifiQrValue(spot.ssid)};P:${escapeWifiQrValue(password)};;`
                : `WIFI:T:nopass;S:${escapeWifiQrValue(spot.ssid)};;`;

            document.getElementById('connectSsid').textContent = spot.ssid;
            const message = document.getElementById('connectMessage');
            wifiQrCode.replaceChildren();
            if (typeof QRCode === 'undefined') {
                message.textContent = 'QR code could not be generated. Connect through your device Wi-Fi settings.';
            } else {
                message.textContent = 'Scan with your phone camera to join.';
                new QRCode(wifiQrCode, {
                    text: qrText,
                    width: 240,
                    height: 240,
                    correctLevel: QRCode.CorrectLevel.M
                });
            }
            connectDialog.showModal();
        }

        const consentCheckbox = document.getElementById('ownerConsent');
        const submitBtn = document.getElementById('btnSubmit');

        consentCheckbox.addEventListener('change', (e) => {
            submitBtn.disabled = !e.target.checked;
        });

        document.getElementById('wifiForm').addEventListener('submit', (e) => {
            e.preventDefault();

            if (!selectedCoords) return alert("Please select a location on the map.");

            const payload = {
                venueName: "Wi-Fi Hotspot",
                ssid: document.getElementById('ssid').value,
                password: document.getElementById('password').value || "None (Open)",
                notes: "No special instructions",
                lat: selectedCoords.lat,
                lng: selectedCoords.lng
            };

            saveHotspotToDatabase(payload);

            document.getElementById('wifiForm').reset();
            submitBtn.disabled = true;
        });

        function renderHotspotOnMap(spot) {
            const spotId = String(spot.id ?? '');
            if (spotId && hotspotMarkers.has(spotId)) {
                map.removeLayer(hotspotMarkers.get(spotId));
            }

            const wifiIcon = L.divIcon({
                html: `<div style="background:#10b981; color:white; width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; border:2px solid white; box-shadow:0 0 10px rgba(0,0,0,0.3);">
                        <i class="fa-solid fa-wifi"></i>
                       </div>`,
                className: '',
                iconSize: [32, 32],
                iconAnchor: [16, 16]
            });

            const popupContent = `
                <div>
                    <h3>${escapeHtml(spot.venue_name || spot.venueName)}</h3>
                    <p style="color:#10b981; font-weight:bold;"><i class="fa-solid fa-circle-check"></i> Owner Consented</p>
                    <p style="margin-top:8px;"><strong>SSID:</strong> ${escapeHtml(spot.ssid)}</p>
                    <div class="wifi-key">Key: ${escapeHtml(spot.password)}</div>
                    <p style="margin-top:8px; font-style:italic;">"${escapeHtml(spot.notes)}"</p>
                    <div class="popup-actions">
                        <button type="button" class="popup-action" data-action="connect" data-id="${escapeHtml(spotId)}">Connect</button>
                        <button type="button" class="popup-action popup-action-secondary" data-action="edit" data-id="${escapeHtml(spotId)}">Edit</button>
                    </div>
                </div>
            `;

            const marker = L.marker([parseFloat(spot.lat), parseFloat(spot.lng)], { icon: wifiIcon })
                .addTo(map)
                .bindPopup(popupContent);
            marker.on('popupopen', (event) => {
                const popup = event.popup.getElement();
                popup.querySelector('[data-action="connect"]').addEventListener('click', () => showWifiQr(spot));
                popup.querySelector('[data-action="edit"]').addEventListener('click', () => openEditDialog(spot));
            });
            if (spotId) hotspotMarkers.set(spotId, marker);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = initMap;
    </script>
</body>
</html>
